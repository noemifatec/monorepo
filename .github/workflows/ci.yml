
name: Monorepo CI Pipeline

on:
  # Dispara automaticamente ao enviar novos commits para a branch main
  push:
    branches:
      - main
  # Dispara na abertura ou atualização de Pull Request direcionados para a branch main
  pull_request:
    branches:
      - main
  # Permite execução manual pelo painel web do Github ( aba Actions -> Run workflow)
  workflow_dispatch:

jobs:
  validar-codigo:
    name: Validar Backend, Frontend e Testes
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o codigo fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24 com Cache de Dependencias
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 4. Instalar Dependencias do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Padronização de Código (ESLint)
        run: |
          cd backend
          pnpm run lint

      - name: 6. Validar Formatação de Arquivos (Prettier)
        run: |
          cd backend
          pnpm run format:check

      - name: 7. Checagem de Tipos no Backend (tsc --noEmit)
        run: |
          cd backend
          pnpm run type-check

      - name: 8. Validar Tipos e Compilar o Backend (Express)
        run: |
          cd backend
          pnpm run build

      - name: 9. Validar Frontend (quando presente no monorepo)
        run: |
          if [ -d "app" ]; then
            echo "Subprojeto frontend encontrado. Iniciando validação..."
            cd app
            pnpm install --frozen-lockfile
            pnpm run build
          else 
            echo "Subprojeto app ainda não adicionado ao monorepo."
          fi

  validar-build-docker:
    name: Validação de Build do Docker
    needs: [validar-codigo]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Testar se os Dockerfiles Compilam sem Erros
        run: |
          echo "Construindo imagem Docker do Backend..."
          docker build -t api-service:smoke-test ./backend
          
          if [ -d "app" ]; then
            echo "Construindo imagem Docker do Frontend..."
            docker build -t app-service:smoke-test ./app
          fi

      - name: 3. Resumo da execução
        run: |
          echo "Integração Contínua concluída com sucesso!"
          echo "Autor da alteração: ${{ github.actor }}"
          echo "Commit validado: ${{ github.sha }}"